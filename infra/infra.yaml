AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 1 - Infrastructure for a 3-node kubeadm Kubernetes cluster.
  One control plane (with Elastic IP) and two workers in a single public subnet.
  This template provisions machines and network only. It installs nothing.

# =============================================================================
# Parameters
# =============================================================================
Parameters:

  ProjectName:
    Type: String
    Default: teleport-k8s
    Description: Prefix for all resource names and the shared Project tag.

  AdminCidr:
    Type: String
    Description: >
      Your public IP in CIDR form (e.g. 203.0.113.4/32). Grants SSH, Kubernetes
      API, and NodePort access. Never widen this to 0.0.0.0/0.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  PublicIngressCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: >
      CIDR allowed to reach ports 80/443. Defaults to a closed value. Set to
      0.0.0.0/0 only if you need a public ACME HTTP-01 challenge to succeed.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  AmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: >
      Resolved from SSM Public Parameters at deploy time, so the template does
      not rot as Canonical publishes new images.

  ControlPlaneInstanceType:
    Type: String
    Default: t3.medium
    Description: kubeadm preflight needs 2 vCPU and ~1700MB free RAM.

  WorkerInstanceType:
    Type: String
    Default: t3.small

  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    Description: GB. Container images fill the 8GB default and trigger DiskPressure.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  SubnetCidr:
    Type: String
    Default: 10.0.1.0/24

  ControlPlanePrivateIp:
    Type: String
    Default: 10.0.1.10

  Worker1PrivateIp:
    Type: String
    Default: 10.0.1.21

  Worker2PrivateIp:
    Type: String
    Default: 10.0.1.22

  ApiEndpointName:
    Type: String
    Default: k8s-api.internal
    Description: Split-horizon hostname for the API server. Added to certSANs.

  # kubeadm keys nodes on hostname; parameterised so config.env stays canonical.
  ControlPlaneHostname:
    Type: String
    Default: cp01

  Worker1Hostname:
    Type: String
    Default: worker01

  Worker2Hostname:
    Type: String
    Default: worker02

# =============================================================================
# Conditions
# =============================================================================
Conditions:

  # If PublicIngressCidr equals AdminCidr the 80/443 rules would duplicate the
  # admin rules and EC2 rejects the group with InvalidPermission.Duplicate.
  PublicIngressDistinct: !Not [!Equals [!Ref PublicIngressCidr, !Ref AdminCidr]]

# =============================================================================
# Network
# =============================================================================
Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'
        - Key: Project
          Value: !Ref ProjectName

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Single public subnet; workers get public IPs for direct SSH. Production
  # would use a private subnet behind a bastion. See docs/DESIGN.md.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-subnet'
        - Key: Project
          Value: !Ref ProjectName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'
        - Key: Project
          Value: !Ref ProjectName

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

# --- Security group ----------------------------------------------------------
# One self-referencing rule covers every intra-cluster port (etcd, kubelet,
# scheduler, NodePort, CNI overlay). Enumerating them is how you miss one.
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} kubeadm cluster'
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: SSH from admin
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
        - Description: Kubernetes API from admin
          IpProtocol: tcp
          FromPort: 6443
          ToPort: 6443
          CidrIp: !Ref AdminCidr
        - Description: NodePort range from admin (nginx demo)
          IpProtocol: tcp
          FromPort: 30000
          ToPort: 32767
          CidrIp: !Ref AdminCidr
        - Description: HTTP from admin
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AdminCidr
        - Description: HTTPS from admin
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AdminCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-sg'
        - Key: Project
          Value: !Ref ProjectName

  # Separate resources: a Condition cannot gate an item inside an inline list.
  PublicHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: PublicIngressDistinct
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      Description: HTTP for ACME HTTP-01 (closed by default)
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref PublicIngressCidr

  PublicHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: PublicIngressDistinct
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      Description: HTTPS public (closed by default)
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PublicIngressCidr

  # Self-reference must be a separate resource: the group ID does not exist
  # while the group itself is still being created.
  ClusterSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref ClusterSecurityGroup
      Description: All traffic between cluster nodes

# --- Key pair ----------------------------------------------------------------
# Private half lands in SSM at /ec2/keypair/{KeyPairId}; bootstrap.sh fetches it.
# A reviewer needs no pre-existing key.
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${ProjectName}-key'
      KeyType: ed25519
      Tags:
        - Key: Project
          Value: !Ref ProjectName

# --- Instance IAM role -------------------------------------------------------
# SSM Session Manager only. No Route53 grant: kubeadm has no IRSA, so pods would
# inherit it. See docs/DESIGN.md.
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-node-role'
        - Key: Project
          Value: !Ref ProjectName

  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref NodeRole

# =============================================================================
# Instances
# =============================================================================
  ControlPlane:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref ControlPlaneInstanceType
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref NodeInstanceProfile
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: !Ref ControlPlanePrivateIp
      SecurityGroupIds:
        - !Ref ClusterSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true   # account-default aws/ebs key; etcd lives here
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname ${ControlPlaneHostname}
          cat >> /etc/hosts <<EOF
          ${ControlPlanePrivateIp} ${ControlPlaneHostname} ${ApiEndpointName}
          ${Worker1PrivateIp} ${Worker1Hostname}
          ${Worker2PrivateIp} ${Worker2Hostname}
          EOF
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cp01'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Role
          Value: control-plane

  ControlPlaneEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cp-eip'
        - Key: Project
          Value: !Ref ProjectName

  # Keeps certSANs valid across a stop/start.
  ControlPlaneEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ControlPlaneEip.AllocationId
      InstanceId: !Ref ControlPlane

  Worker1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref WorkerInstanceType
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref NodeInstanceProfile
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: !Ref Worker1PrivateIp
      SecurityGroupIds:
        - !Ref ClusterSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true   # account-default aws/ebs key; etcd lives here
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname ${Worker1Hostname}
          cat >> /etc/hosts <<EOF
          ${ControlPlanePrivateIp} ${ControlPlaneHostname} ${ApiEndpointName}
          ${Worker1PrivateIp} ${Worker1Hostname}
          ${Worker2PrivateIp} ${Worker2Hostname}
          EOF
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-worker01'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Role
          Value: worker

  # Ingress entry point. No cloud-controller-manager here, so type: LoadBalancer
  # would sit Pending forever. Replaces worker01's auto-assigned IP, so it adds
  # no IPv4 charge. See docs/DESIGN.md.
  IngressEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ingress-eip'
        - Key: Project
          Value: !Ref ProjectName

  IngressEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt IngressEip.AllocationId
      InstanceId: !Ref Worker1

  Worker2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref WorkerInstanceType
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref NodeInstanceProfile
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: !Ref Worker2PrivateIp
      SecurityGroupIds:
        - !Ref ClusterSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true   # account-default aws/ebs key; etcd lives here
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname ${Worker2Hostname}
          cat >> /etc/hosts <<EOF
          ${ControlPlanePrivateIp} ${ControlPlaneHostname} ${ApiEndpointName}
          ${Worker1PrivateIp} ${Worker1Hostname}
          ${Worker2PrivateIp} ${Worker2Hostname}
          EOF
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-worker02'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Role
          Value: worker

# =============================================================================
# Outputs - these replace a hand-rolled state file. Phase 2 reads them.
# =============================================================================
Outputs:

  KeyPairId:
    Description: Used to fetch the private key from SSM Parameter Store.
    Value: !GetAtt KeyPair.KeyPairId

  ControlPlanePrivateIp:
    Description: kubeadm advertiseAddress.
    Value: !GetAtt ControlPlane.PrivateIp

  ControlPlanePublicIp:
    Description: Elastic IP. SSH target and laptop-side certSAN.
    Value: !Ref ControlPlaneEip

  # Elastic IP on worker01. This is the ingress entry point and the address the
  # nginx site's hostname resolves to in your laptop /etc/hosts.
  IngressPublicIp:
    Description: Stable public address for the ingress controller.
    Value: !Ref IngressEip

  # The EIP, not !GetAtt Worker1.PublicIp: GetAtt resolves before the
  # association runs and would return the address it replaces.
  Worker1PublicIp:
    Value: !Ref IngressEip

  Worker2PublicIp:
    Value: !GetAtt Worker2.PublicIp

  Worker1PrivateIp:
    Value: !GetAtt Worker1.PrivateIp

  Worker2PrivateIp:
    Value: !GetAtt Worker2.PrivateIp

  ApiEndpoint:
    Description: Add this to your laptop /etc/hosts pointing at ControlPlanePublicIp.
    Value: !Sub '${ApiEndpointName}:6443'

  SecurityGroupId:
    Value: !Ref ClusterSecurityGroup

  # Needed by 'aws ssm start-session --target'.
  ControlPlaneInstanceId:
    Value: !Ref ControlPlane

  Worker1InstanceId:
    Value: !Ref Worker1

  Worker2InstanceId:
    Value: !Ref Worker2
