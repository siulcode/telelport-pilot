# The certificate chain for the site. ClusterIssuers are cluster-scoped, so
# admin creates them; the demo user only creates namespaced Certificate objects
# that reference the CA issuer by name.
#
# Three steps, because you cannot sign anything without a CA first:
#   1. a SelfSigned issuer, which can only sign for itself
#   2. use it to mint a CA certificate (isCA: true) into a Secret
#   3. a CA ClusterIssuer backed by that Secret -- this signs the leaf
#
# Self-signed rather than ACME because the cluster has no public DNS name.
# Fully offline, no rate limits, and a reviewer can run the repo with no domain.
# The real-domain path is described in docs/DESIGN.md.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-ca
  namespace: cert-manager      # where the CA key lives; nobody else can read it
spec:
  isCA: true
  commonName: teleport-k8s-demo-ca
  secretName: demo-ca-tls
  duration: 8760h              # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: demo-ca
spec:
  ca:
    secretName: demo-ca-tls
