# Traefik ingress controller. Cluster infrastructure, so admin deploys it --
# the demo user only creates Ingress objects that Traefik then serves.
#
# DaemonSet + nodeSelector rather than a Deployment: hostPort means one pod per
# node by construction, and two replicas on one node would fight over :443.
# Pinned to worker01 because that is where the ingress Elastic IP lives.
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  # nodes is required: the Kubernetes provider watches them, and without it the
  # informer cache never syncs, so Traefik publishes no routers at all and
  # silently serves its built-in default certificate.
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik
  namespace: traefik
spec:
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik
      nodeSelector:
        kubernetes.io/hostname: worker01
      # hostPort, not hostNetwork: the pod keeps its own network identity, so
      # NetworkPolicy selecting app=traefik matches and Hubble attributes flows
      # to the pod instead of the node. Needs Cilium's portmap chaining.
      dnsPolicy: ClusterFirst
      containers:
        - name: traefik
          image: traefik:v3.7.10
          args:
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --api.dashboard=false
            - --log.level=INFO
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
            - name: websecure
              containerPort: 443
              hostPort: 443
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Required to bind 80/443 as a non-root user.
              add: ["NET_BIND_SERVICE"]
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
